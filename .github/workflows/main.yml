name: Void Translator Phase 12

on:
  workflow_dispatch:
    inputs:
      run_duration:
        description: "مدة تشغيل البوت بالدقائق"
        required: true
        default: "300"

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure API Keys
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AI_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_IDS: ${{ secrets.SUPER_ADMIN_IDS }}
        run: |
          test -n "$TG_TOKEN" || exit 1
          test -n "$AI_KEY" || exit 1

          umask 077

          printf 'MANGA_BOT_TELEGRAM_BOT_TOKEN=%s\n' "$TG_TOKEN" > .env
          printf 'MANGA_BOT_AI_API_KEY=%s\n' "$AI_KEY" >> .env

          if [ -n "$ADMIN_IDS" ]; then
            printf 'MANGA_BOT_SUPER_ADMIN_IDS=%s\n' "$ADMIN_IDS" >> .env
          fi

      - name: Health Check
        run: |
          python -m utils.healthcheck

      - name: Start Void Translator
        env:
          RUN_DURATION: ${{ inputs.run_duration }}
        run: |
          if ! [[ "$RUN_DURATION" =~ ^[1-9][0-9]{0,2}$ ]] || (( RUN_DURATION > 350 )); then
            echo "Invalid run duration"
            exit 1
          fi

          echo "Starting Void Translator..."

          set +e
          timeout --signal=INT --kill-after=30s \
            "${RUN_DURATION}m" python main.py

          STATUS=$?

          if [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 130 ]; then
            echo "Bot stopped normally."
            exit 0
          fi

          exit "$STATUS"

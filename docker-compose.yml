services:
  void-translator:
    build: .
    container_name: void-translator
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      MANGA_BOT_DATABASE_PATH: /app/data/manga_bot.db
      MANGA_BOT_INSTANCE_LOCK_PATH: /app/.runtime/void_translator.lock
    volumes:
      - void_translator_data:/app/data
      - void_translator_runtime:/app/.runtime

volumes:
  void_translator_data:
  void_translator_runtime:
